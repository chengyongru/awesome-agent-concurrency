<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="多智能体并发协调机制的无限画布式交互图谱。">
  <title>awesome-agent-concurrency</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/canvas.css">
</head>
<body class="canvas-page">
  <a class="skip-link" href="#canvas-viewport">跳到画布</a>

  <header class="canvas-header">
    <div class="canvas-location" aria-live="polite">
      <span data-location-index>01</span>
      <strong data-location-title>Held Draft</strong>
    </div>
    <a class="canvas-github" href="https://github.com/chengyongru/awesome-agent-concurrency" aria-label="在 GitHub 查看项目">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.59 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.09.68-.22.68-.49v-1.92c-2.78.62-3.37-1.21-3.37-1.21-.45-1.19-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .08 1.53 1.06 1.53 1.06.89 1.57 2.34 1.12 2.91.86.09-.67.35-1.12.64-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.04 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.3 9.3 0 0 1 12 6.69a9.3 9.3 0 0 1 2.5.35c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.71 1.03 1.63 1.03 2.75 0 3.94-2.35 4.81-4.58 5.07.36.32.68.94.68 1.89v3.08c0 .27.18.59.69.49A10.27 10.27 0 0 0 22 12.25C22 6.59 17.52 2 12 2Z"/></svg>
    </a>
  </header>

  <main class="canvas-app" data-canvas-app>
    <h1 class="sr-only">多智能体并发协调机制</h1>
    <nav class="canvas-navigator" id="canvas-index" data-canvas-navigator data-collapsed="false" aria-label="画布位置">
      <button class="navigator-toggle" type="button" data-navigator-toggle aria-controls="canvas-index" aria-expanded="true" aria-label="收起算法导航">
        <span aria-hidden="true">
          <svg class="navigator-toggle-collapse" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></svg>
          <svg class="navigator-toggle-expand" viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7"/></svg>
        </span>
      </button>
      <button class="navigator-item" type="button" data-jump="held-draft" aria-current="true"><span>01</span><strong>Held Draft</strong></button>
      <button class="navigator-item" type="button" data-jump="sequencer"><span>02</span><strong>Sequencer</strong></button>
      <button class="navigator-item" type="button" data-jump="coagent"><span>03</span><strong>CoAgent</strong></button>
      <button class="navigator-item" type="button" data-jump="latte"><span>04</span><strong>LATTE</strong></button>
      <button class="navigator-item" type="button" data-jump="syncplan"><span>05</span><strong>SyncPlan</strong></button>
      <button class="navigator-item" type="button" data-jump="atomix"><span>06</span><strong>Atomix</strong></button>
      <button class="navigator-item" type="button" data-jump="cordon"><span>07</span><strong>Cordon</strong></button>
      <button class="navigator-item" type="button" data-jump="tracefix"><span>08</span><strong>TraceFix</strong></button>
    </nav>

    <div class="canvas-viewport" id="canvas-viewport" data-canvas-viewport tabindex="0" aria-label="机制图谱画布。拖动以平移，按住 Ctrl 或 Command 滚动以缩放。">
      <div class="canvas-world" data-canvas-world>
        <article class="canvas-frame algorithm-frame" data-canvas-node="held-draft" data-index="01" data-title="Held Draft" style="--x: -4200px; --y: 800px; --node-width: 1120px; --node-height: 720px;" tabindex="-1">
          <header class="node-heading"><h2>并发报数</h2></header>
          <div class="node-demo-slot" data-demo-slot="held-draft"><span>加载实验 01…</span></div>
        </article>

        <article class="canvas-frame algorithm-frame" data-canvas-node="sequencer" data-index="02" data-title="子 Agent 结果汇聚" style="--x: -1400px; --y: 800px; --node-width: 1120px; --node-height: 720px;" tabindex="-1">
          <header class="node-heading"><h2>子 Agent 结果汇聚</h2></header>
          <div class="node-demo-slot" data-demo-slot="sequencer"><span>加载实验 02…</span></div>
        </article>

        <article class="canvas-frame algorithm-frame" data-canvas-node="coagent" data-index="03" data-title="局部依赖修复" style="--x: 1400px; --y: 800px; --node-width: 1120px; --node-height: 720px;" tabindex="-1">
          <header class="node-heading"><h2>局部依赖修复</h2></header>
          <div class="node-demo-slot" data-demo-slot="coagent"><span>加载实验 03…</span></div>
        </article>

        <article class="canvas-frame algorithm-frame" data-canvas-node="latte" data-index="04" data-title="动态任务图调度" style="--x: 4200px; --y: 800px; --node-width: 1120px; --node-height: 720px;" tabindex="-1">
          <header class="node-heading"><h2>动态任务图调度</h2></header>
          <div class="node-demo-slot" data-demo-slot="latte"><span>加载实验 04…</span></div>
        </article>

        <article class="canvas-frame algorithm-frame" data-canvas-node="syncplan" data-index="05" data-title="服务发布同步" style="--x: 4200px; --y: 3400px; --node-width: 1120px; --node-height: 720px;" tabindex="-1">
          <header class="node-heading"><h2>服务发布同步</h2></header>
          <div class="node-demo-slot" data-demo-slot="syncplan"><span>加载实验 05…</span></div>
        </article>

        <article class="canvas-frame algorithm-frame" data-canvas-node="atomix" data-index="06" data-title="差旅副作用结算" style="--x: 1400px; --y: 3400px; --node-width: 1120px; --node-height: 720px;" tabindex="-1">
          <header class="node-heading"><h2>差旅副作用结算</h2></header>
          <div class="node-demo-slot" data-demo-slot="atomix"><span>加载实验 06…</span></div>
        </article>

        <article class="canvas-frame algorithm-frame" data-canvas-node="cordon" data-index="07" data-title="扩容授权检查" style="--x: -1400px; --y: 3400px; --node-width: 1120px; --node-height: 720px;" tabindex="-1">
          <header class="node-heading"><h2>扩容授权检查</h2></header>
          <div class="node-demo-slot" data-demo-slot="cordon"><span>加载实验 07…</span></div>
        </article>

        <article class="canvas-frame algorithm-frame" data-canvas-node="tracefix" data-index="08" data-title="共享文件锁验证" style="--x: -4200px; --y: 3400px; --node-width: 1120px; --node-height: 720px;" tabindex="-1">
          <header class="node-heading"><h2>共享文件锁验证</h2></header>
          <div class="node-demo-slot" data-demo-slot="tracefix"><span>加载实验 08…</span></div>
        </article>
      </div>
    </div>

    <div class="canvas-controls" aria-label="画布缩放">
      <button type="button" data-zoom-out aria-label="缩小">−</button>
      <output data-zoom-output aria-live="polite">100%</output>
      <button type="button" data-zoom-in aria-label="放大">＋</button>
      <button type="button" data-fit aria-label="返回当前节点">⌖</button>
    </div>
    <div class="canvas-shortcuts" aria-hidden="true">拖动平移 · Ctrl / ⌘ + 滚轮缩放</div>
    <p class="sr-only" role="status" aria-live="polite" data-canvas-live></p>
  </main>

  <script type="module" src="assets/index.js"></script>
</body>
</html>
